<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceSync: Mission Designer</title>
<style>
:root{--bg:#050816;--panel:rgba(16,22,48,.78);--line:rgba(140,170,255,.18);--txt:#eef3ff;--mut:#9fb0d8;--cy:#38e8ff;--pu:#9b6bff;--pk:#ff5fa8;--go:#ffcc33;--ok:#3cf2a0;--bad:#ff4d6d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:relative;z-index:1;min-height:100vh;display:none}
.screen.on{display:block;animation:fade .45s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:800;transition:transform .15s,box-shadow .2s;user-select:none}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#38e8ff,#9b6bff);color:#071026;box-shadow:0 8px 26px rgba(80,140,255,.4)}
.btn.go{background:linear-gradient(135deg,#ffcc33,#ff8a3d);color:#2a1300;box-shadow:0 8px 26px rgba(255,160,50,.4)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}a.btn{color:inherit;text-decoration:none}.rbox h1,.rbox h2{direction:ltr}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}.ico svg{width:100%;height:100%}
.top{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:0;z-index:5;background:rgba(5,8,22,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.logo{font-weight:900;font-size:21px;direction:ltr;background:linear-gradient(90deg,#38e8ff,#9b6bff,#ff5fa8);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:13px}
.coins{color:var(--go)}.coins.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
.iconBtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.iconBtn:hover{background:rgba(56,232,255,.18)}
/* splash + login */
#splash.on,#login.on{display:grid;place-items:center;padding:20px}
.brand{font-size:clamp(44px,9vw,84px);font-weight:900;background:linear-gradient(90deg,#38e8ff,#9b6bff,#ff5fa8,#ffcc33);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;text-align:center;animation:pop 1s cubic-bezier(.2,1.6,.4,1) both .2s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.floaty{animation:floaty 3s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-10px) rotate(-3deg)}}
.rocketFly{animation:rfly 2.2s ease-in both}@keyframes rfly{from{transform:translate(-40px,120px) rotate(35deg)}to{transform:translate(420px,-260px) rotate(35deg)}}
.twk{animation:twk 1.4s ease-in-out infinite alternate}@keyframes twk{from{opacity:.2}to{opacity:1}}
.flick{animation:flick .12s infinite alternate;transform-origin:50% 0}@keyframes flick{to{transform:scaleY(1.25)}}
.loginWrap{position:relative;width:min(420px,94vw)}
.loginCard{padding:30px 26px}.loginCard h1{text-align:center;font-size:28px}.loginCard .sub{text-align:center;color:var(--mut);margin:4px 0 20px}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:700}
.field input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(5,10,30,.6);outline:none;direction:ltr}
.field input:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(56,232,255,.15)}
.msg{min-height:22px;text-align:center;font-weight:700;color:var(--bad);margin:4px 0}
.note{font-size:12px;color:var(--mut);line-height:1.6}
#astro{position:absolute;width:150px;top:-118px;inset-inline-start:-30px;z-index:3;transform:translateY(80px) scale(.3) rotate(-30deg);opacity:0;transition:transform .6s cubic-bezier(.2,1.8,.4,1),opacity .3s;pointer-events:none}
#astro.show{transform:none;opacity:1}#astro.show .bob{animation:floaty 2.6s ease-in-out infinite}
#astro .shade{transition:transform .35s;transform:translateY(-34px)}#astro.shy .shade{transform:none}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.spark{position:fixed;pointer-events:none;z-index:90;font-size:14px;animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(160deg)}}
/* map */
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.mapBox{position:relative;height:620px;margin-top:10px;overflow:hidden}
.mapBox svg.path{position:absolute;inset:0;width:100%;height:100%}
.bubble{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;display:grid;place-items:center;text-align:center;cursor:pointer;transition:transform .25s;
 background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(56,232,255,.25) 35%,rgba(155,107,255,.35) 70%,rgba(20,20,60,.6));border:2px solid rgba(160,220,255,.55);box-shadow:0 0 30px rgba(56,232,255,.35),inset 0 0 25px rgba(255,255,255,.15);animation:bob 4s ease-in-out infinite}
.bubble:nth-child(2n){animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble:hover{transform:scale(1.08)}
.bubble b{font-size:34px;display:block;line-height:1}.bubble small{font-size:12px;font-weight:700;display:block;max-width:110px}
.bubble .pr{font-size:11px;color:var(--go);font-weight:800}
.bubble.locked{filter:grayscale(1);opacity:.45}.bubble.done{border-color:var(--ok);box-shadow:0 0 30px rgba(60,242,160,.45)}
#hero{position:absolute;width:86px;margin:-150px 0 0 -43px;transition:left 1.1s cubic-bezier(.45,0,.3,1),top 1.1s cubic-bezier(.45,0,.3,1);pointer-events:none;z-index:3}
#hero.jump .hj{animation:hop 1.1s cubic-bezier(.3,0,.3,1)}@keyframes hop{50%{transform:translateY(-120px) rotate(-12deg)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* steps */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.st{flex:1;min-width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:800;text-align:center;opacity:.6}
.st.on{opacity:1;border-color:var(--cy);background:rgba(56,232,255,.12)}.st.done{opacity:1;border-color:rgba(60,242,160,.5)}
.st i{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 330px;gap:16px}
.panel{padding:18px}
h2{font-size:24px;margin-bottom:8px}h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
p.lead{color:#d6def7;line-height:1.7}
.navbar{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sg{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;line-height:1.5}.sg b{display:block;color:var(--cy);margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);overflow:hidden;display:flex;flex-direction:column;transition:.2s;cursor:pointer;text-align:start}
.card:hover{border-color:var(--cy);transform:translateY(-3px)}.card.on{border-color:var(--ok);box-shadow:0 0 0 2px rgba(60,242,160,.5)}
.card .im{height:130px;background:#0b1130;display:grid;place-items:center;overflow:hidden;position:relative}
.card .im img{width:100%;height:100%;object-fit:cover}.card .im svg{width:90px;height:90px}
.card .im .tag{position:absolute;bottom:6px;inset-inline-start:6px;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);font-weight:800}
.card .bd{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.card .bd b{font-size:14px}.card .bd p{font-size:12px;color:var(--mut);line-height:1.5}
.specs{display:flex;flex-wrap:wrap;gap:4px}.specs span{font-size:10.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.07);direction:ltr}
.card .add{margin-top:auto;font-size:12px;font-weight:800;color:var(--cy)}.card.on .add{color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:800;font-size:13px}.tab.on{background:linear-gradient(135deg,rgba(56,232,255,.3),rgba(155,107,255,.3));border-color:var(--cy)}
.dash .row{margin-bottom:10px}.dash .row label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.dash .row label b{color:var(--txt);direction:ltr}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#38e8ff,#9b6bff);transition:width .4s}
.bar.over i{background:linear-gradient(90deg,#ff8a3d,#ff4d6d)}
.req{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}.req div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}.req .vm{color:var(--mut);font-size:12px}
.orbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ob{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:start}.ob.on{border-color:var(--cy);background:rgba(56,232,255,.12)}.ob b{font-size:18px}
input[type=range]{width:100%;accent-color:#38e8ff}
/* launch */
#launch.on{display:block}#c{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
.hud{position:fixed;z-index:3;pointer-events:none}#lblEvt{top:16%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,44px);font-weight:900;text-shadow:0 0 20px rgba(0,0,0,.8);direction:ltr;white-space:nowrap}
#lblTL{top:14px;inset-inline-start:14px}.hud .p{background:rgba(5,10,30,.72);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;max-width:440px}
#result{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(2,4,14,.55);padding:14px}#result.on{display:grid}
.rbox{width:min(560px,96vw);padding:26px;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;max-height:92vh;overflow:auto}
.rbox h1{font-size:clamp(30px,6vw,46px);margin:6px 0}.rbox h1.win{background:linear-gradient(90deg,#ffcc33,#3cf2a0,#38e8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.rbox h1.bad{color:var(--bad)}
.rbox .art{width:120px;margin:-6px auto 0}.why{text-align:start;background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35);border-radius:14px;padding:12px;margin:12px 0;line-height:1.7;font-size:14px}
.hint{text-align:start;background:rgba(255,204,51,.1);border:1px solid rgba(255,204,51,.4);border-radius:14px;padding:12px;margin:12px 0;line-height:1.7;font-size:14px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* modal */
#modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(2,4,14,.72);backdrop-filter:blur(6px);padding:14px}#modal.on{display:grid}
.mbox{width:min(760px,96vw);max-height:90vh;overflow:auto;padding:22px}
.mbox table{width:100%;border-collapse:collapse;font-size:12.5px}.mbox td,.mbox th{padding:7px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}.mbox a{color:var(--cy)}
.mlist{display:grid;gap:10px}.mi{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;text-align:start}.mi:hover{border-color:var(--cy)}.mi.done{border-color:rgba(60,242,160,.5)}
.mi .n{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#38e8ff,#9b6bff);color:#071026}
.tour{max-width:560px;text-align:center}.tour .big{font-size:56px}.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--cy)}
.pub{color:var(--ok);font-weight:800}.est{color:var(--go);font-weight:800}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(100px);z-index:95;padding:12px 18px;border-radius:14px;background:#1a2350;border:1px solid var(--line);font-weight:700;transition:.35s}#toast.on{transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
.poster{display:flex;gap:18px;align-items:center;padding:20px}.poster .pl{width:120px;flex:none}.ptitle{font-size:clamp(28px,5vw,44px);background:linear-gradient(90deg,#ffcc33,#ff5fa8,#38e8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.bchip{padding:14px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;animation:pop .5s both}.bchip .bi{font-size:30px}.bchip b{display:block;font-size:16px;margin-top:4px}.bchip span{font-size:11px;color:var(--mut)}
.orbs.big .ob{text-align:center;padding:12px}.orbs.big svg{width:100%;height:90px}.orbs.big b{font-size:22px}
.altBox{padding:14px;margin-top:12px}.mono{direction:ltr}
.build{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.bay{display:flex;flex-direction:column;gap:8px}.busPick{display:flex;gap:6px;justify-content:center}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.gauge{text-align:center}.gauge svg{width:84px;height:84px}.gauge b{display:block;font-size:13px}.gauge span{font-size:11px;color:var(--mut);direction:ltr;display:block}
.gauge.bad{animation:shake .5s}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card .info{position:absolute;top:6px;inset-inline-end:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;font-weight:900;font-size:13px;border:1px solid var(--line)}
.card .why{position:absolute;inset:0;background:rgba(5,10,30,.92);padding:12px;font-size:12px;line-height:1.5;display:none;text-align:start}.card .im.showWhy .why{display:block}
.launchBtn{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,160,50,0),0 8px 36px rgba(255,160,50,.7)}}
.st{font-size:13px}
@media (max-width:900px){.build{grid-template-columns:1fr}.poster{flex-direction:column;text-align:center}}

/* ===== v2 game screens ===== */
.wrap.wide{max-width:1500px}.btn.sm{padding:7px 12px;font-size:13px}.cn{font-size:14px}
.center{position:relative;min-height:calc(100vh - 66px);display:grid;place-items:center;padding:20px;overflow:hidden}
.scBack{position:absolute;inset:auto 0 0 0;height:46%;pointer-events:none;opacity:.95}.scBack svg{width:100%;height:100%}.scBack.dim{opacity:.35;height:55%}
.menuBox{position:relative;z-index:2;width:min(880px,96vw);text-align:center}.heroAstro{width:120px;margin:0 auto}.brandS{font-size:clamp(40px,7vw,70px);font-weight:900;background:linear-gradient(90deg,#38e8ff,#9b6bff,#ff5fa8,#ffcc33);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.menuGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.mbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:20px;background:rgba(16,22,48,.82);border:1px solid var(--line);font-size:28px;transition:.2s;color:inherit;text-decoration:none;backdrop-filter:blur(8px)}
.mbtn b{font-size:14px}.mbtn span{font-size:11px;color:var(--mut)}.mbtn:hover{transform:translateY(-4px);border-color:#ff8a3d;box-shadow:0 12px 30px rgba(255,138,61,.3)}.mbtn.big{grid-column:span 2;background:linear-gradient(135deg,rgba(255,138,61,.35),rgba(56,232,255,.25));border-color:#ff8a3d}
.flameAnim{animation:flick .12s infinite alternate}.launching{animation:rise 9s ease-in infinite}@keyframes rise{0%,40%{transform:translateY(0)}100%{transform:translateY(-420px)}}
.walker{animation:walk 9s linear infinite}@keyframes walk{50%{transform:translateX(60px)}}.truck{animation:walk 14s ease-in-out infinite}.dishSpin{animation:dish 4s ease-in-out infinite alternate}@keyframes dish{to{transform:rotate(25deg)}}
.briefGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-top:12px}.bitem{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.bitem .bn{width:24px;height:24px;border-radius:50%;background:#ff8a3d;color:#1b0b00;font-weight:900;display:grid;place-items:center;flex:none;font-size:12px}.bitem .bi{font-size:24px}.bitem small{display:block;color:var(--mut);font-size:11px}.bitem b{font-size:14px;line-height:1.5}
.storeBar{padding:12px;display:grid;gap:8px;margin-bottom:12px}.storeBar input,.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(5,10,30,.6);color:var(--txt)}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.scard{padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.2s}
.scard:hover{transform:translateY(-3px);border-color:var(--cy)}.scard.own{border-color:rgba(60,242,160,.55)}.scard.lock{opacity:.55}.sart{height:110px;display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(56,232,255,.15),transparent 70%);border-radius:14px}.sart svg{height:100px}
.lk{position:absolute;top:4px;inset-inline-end:4px;font-size:11px;font-weight:900;background:#2b3566;padding:2px 7px;border-radius:8px}.sfoot{margin-top:auto}.okc{color:var(--ok);font-weight:900}
.det{display:flex;gap:16px;align-items:flex-start}.dart{width:150px;flex:none}.det table td{padding:5px 8px}@media(max-width:600px){.det{flex-direction:column}}
.statsRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
.bdg{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed var(--line);text-align:center;opacity:.45}.bdg span{font-size:30px;display:block}.bdg b{font-size:12px}.bdg.on{opacity:1;border:1px solid #ffcc33;background:rgba(255,204,51,.12)}
.bTop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.builder{display:grid;grid-template-columns:330px 1fr 380px;gap:12px}.inv{max-height:calc(100vh - 210px);overflow:auto}.invList{display:grid;gap:8px}
.ii{display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:grab}.ii.in{border-color:var(--ok);background:rgba(60,242,160,.08)}.ii.no{opacity:.6;cursor:default}
.iart{width:52px;height:52px;flex:none}.ii b{font-size:13px;display:block}.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:10px;background:rgba(56,232,255,.15);border:1px solid rgba(56,232,255,.4);font-weight:900;font-size:18px}.qty span{min-width:16px;text-align:center;font-weight:900}
.stage{position:relative;min-height:520px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}.stage.over{outline:3px dashed var(--cy)}
.craft{position:relative;z-index:2;flex:1;display:grid;place-items:center}.craft svg{width:100%;max-height:440px}.craft.pop svg{animation:popc .35s}@keyframes popc{50%{transform:scale(1.04)}}
.craftFloat{animation:cfl 4s ease-in-out infinite}@keyframes cfl{50%{transform:translateY(-6px)}}
